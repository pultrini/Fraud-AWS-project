version: 2

models:
  - name: int_customer_transaction_features
    description: >
      Transações sequenciadas por cliente de origem, com informações
      sobre as transações anterior e seguinte.

    columns:
      - name: transaction_id
        description: "Identificador da transação."
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('fact_transactions')
                field: transaction_id

      - name: origin_account_id
        description: "Cliente usado para construir o histórico."
        data_tests:
          - not_null

      - name: customer_transaction_number
        description: "Posição sequencial da transação no histórico do cliente."
        data_tests:
          - not_null

      - name: previous_transaction_amount
        description: "Valor da transação anterior do cliente."

      - name: previous_transaction_step
        description: "Step da transação anterior do cliente."

      - name: next_transaction_amount
        description: >
          Valor da próxima transação. Coluna diagnóstica que não deve
          ser usada como feature de treinamento.

      - name: hours_since_previous_transaction
        description: "Horas desde a transação anterior."

      - name: days_since_previous_transaction
        description: "Dias fracionários desde a transação anterior."

      - name: simulation_day
        description: "Partição física do modelo."
        data_tests:
          - not_null

      - name: transaction_count_last_10
        description: >
          Quantidade de transações anteriores consideradas na janela
          móvel de dez operações.
        data_tests:
          - not_null

      - name: avg_last_10_transactions
        description: >
          Média dos valores das dez transações anteriores. É nula
          quando o cliente ainda não possui histórico.

      - name: std_last_10_transactions
        description: >
          Desvio-padrão amostral das dez transações anteriores. É nulo
          quando existem menos de duas observações anteriores.

      - name: historical_transaction_count
        description: "Quantidade total de transações anteriores do cliente."
        data_tests:
          - not_null

      - name: customer_average_amount
        description: >
          Média do valor de todas as transações anteriores do cliente.

      - name: cumulative_transaction_value
        description: >
          Soma dos valores de todas as transações anteriores do cliente.

      - name: transaction_count_24h
        description: >
          Quantidade de transações do cliente nas 24 horas anteriores,
          excluindo o step atual.
        data_tests:
          - not_null

      - name: transaction_count_7d
        description: >
          Quantidade de transações do cliente nas 168 horas anteriores,
          excluindo o step atual.
        data_tests:
          - not_null

      - name: amount_vs_customer_average
        description: >
          Diferença entre o valor atual e a média histórica anterior.

      - name: amount_to_customer_average_ratio
        description: >
          Razão entre o valor atual e a média histórica anterior.

      - name: amount_zscore_last_10
        description: >
          Distância padronizada entre o valor atual e o comportamento
          das dez transações anteriores.
